[project]
name = "relay"
version = "0.1.0"
description = "Relay Method — multi-agent software-development workflow"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
]
license = { text = "MIT" }
authors = [
    { name = "Radi Radichev" },
]

[project.scripts]
relay = "relay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]
