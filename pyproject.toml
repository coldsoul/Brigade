[project]
name = "brigade"
version = "0.1.0"
description = "Brigade — an implementation of the Relay Method"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Radi Radichev" },
]
dependencies = [
    "click>=8.0",
    "litellm>=1.0",
    "mcp>=1.0",
    "pydantic>=2.0",
    "python-ulid>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
brigade = "brigade.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brigade"]
